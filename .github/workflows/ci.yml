name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests scripts dashboard
      - name: Run tests
        run: pytest -q --cov=src/microbiome_analysis --cov-report=term-missing

      - name: Smoke pipeline (synthetic)
        run: python scripts/run_pipeline.py --source synthetic --seed 42 --out results/ci_synthetic

      - name: Smoke pipeline (gmrepo if cache present)
        run: |
          if [ -f data/cache/_genus_raw.tsv ]; then
            python scripts/run_pipeline.py --source gmrepo --out results/ci_real
          else
            echo "No real cache checked in -- skipping real-data smoke."
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.python-version }}
          path: results/
          if-no-files-found: ignore
